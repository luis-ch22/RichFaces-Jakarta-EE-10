<html xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
    xmlns:a4j="http://richfaces.org/a4j">
<body>
    <f:view>
        <script type="text/javascript">
        XMLHttpRequest.defaultRequestTime = 5000;

        var counter = 0;
        var time = 0;
    </script>
        <h:form id="form">
            <a4j:commandButton id="buttonDelayed" requestDelay="1000" />
            <a4j:commandButton id="buttonIgnoreDupResponces" ignoreDupResponses="true"
                oncomplete="counter++;time = Timer.currentTime;" />
        </h:form>
    </f:view>
</body>
</html>
