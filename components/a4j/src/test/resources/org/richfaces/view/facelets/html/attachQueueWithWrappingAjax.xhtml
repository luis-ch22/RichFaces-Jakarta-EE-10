<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:a4j="http://richfaces.org/a4j">

    <h:form id="form">
        <a4j:ajax>
            <h:inputText id="defaultEventInput" />
            <h:commandLink id="defaultEventLink" />

            <a4j:attachQueue id="defaultEventQueue" />
        </a4j:ajax>

        <a4j:ajax event="valueChange">
            <h:inputText id="valueChangeInput" />
            <h:commandLink id="valueChangeLink" />

            <a4j:attachQueue id="valueChangeQueue" />
        </a4j:ajax>
    </h:form>
</ui:composition>
