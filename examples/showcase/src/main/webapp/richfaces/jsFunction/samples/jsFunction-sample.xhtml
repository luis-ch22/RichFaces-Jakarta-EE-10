<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:a4j="http://richfaces.org/a4j"
    xmlns:rich="http://richfaces.org/rich">
    <table width="400">
        <tbody>
            <tr>
                <td><span onmouseover="updateName('Kate')" onmouseout="updateName('')">Kate</span></td>
                <td><span onmouseover="updateName('John')" onmouseout="updateName('')">John</span></td>
                <td><span onmouseover="updateName('Alex')" onmouseout="updateName('')">Alex</span></td>
            </tr>
            <tr>
                <td colspan="3">Name: <b> <h:outputText id="showname" value="#{functionBean.text}" /> </b></td>
            </tr>
        </tbody>
    </table>
    <h:form id="form">
        <a4j:jsFunction name="updateName" render="showname">
            <a4j:param name="name" assignTo="#{functionBean.text}" />
        </a4j:jsFunction>
    </h:form>
</ui:composition>
