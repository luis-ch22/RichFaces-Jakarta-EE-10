name: build

# CI for the Jakarta EE 10 / JDK 21 migration of RichFaces.
# The CDK is built and installed first because the runtime consumes its
# SNAPSHOT Maven plugin and generator artifacts.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Temurin 21)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_REPO_LOCAL: ${{ runner.temp }}/m2

    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4

      # The upstream origin/jakarta branch still contains the old
      # com.github.albfernandez coordinates. The fork's main branch contains
      # the Jakarta EE 10 CDK consumed by this runtime.
      - name: Checkout Jakarta CDK
        uses: actions/checkout@v4
        with:
          repository: luis-ch22/RichFaces-CDK-Jakarta-EE-10
          ref: main
          path: cdk

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install CDK
        working-directory: cdk
        run: mvn -B -ntp -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.repo.local="$MAVEN_REPO_LOCAL" clean install

      # Library reactor: BOM, build tooling, core and components (a4j, rich),
      # dist. Tests are skipped here; the unit baseline is run below.
      - name: Build library (skip tests)
        run: mvn -B -ntp -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO_LOCAL" clean install

      # Unit test baseline for core, a4j and rich (container-dependent tests
      # are excluded via the ContainerRequired category).
      - name: Unit tests (core, a4j, rich)
        run: mvn -B -ntp -Dgpg.skip=true -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -pl core,components/a4j,components/rich test
